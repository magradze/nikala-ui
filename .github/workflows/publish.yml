name: Nikala UI Release Pipeline

run-name: ${{ github.event_name == 'pull_request' && 'PR Validation' || 'Production Release' }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  workspace-check:
    name: Validate and Build Workspace
    if: ${{ github.repository_owner == 'nikala-ui' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Core Registry & CLI Packages
        run: bun run build

      - name: Execute Web App Tests
        run: cd apps/web && bunx vitest run

  npm-publish:
    name: Publish Packages to NPM & GitHub Releases
    needs: workspace-check
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository_owner == 'nikala-ui' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Registry Manifests & Build CLI Binary
        run: bun run build

      - name: Publish @nikala-ui/core Package
        run: |
          cd packages/core
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nikala-ui/cli Package
        run: |
          cd packages/cli
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}