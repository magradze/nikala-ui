name: Nikala UI Release Pipeline

run-name: ${{ github.event_name == 'pull_request' && 'PR Validation' || 'Production Release' }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  workspace-check:
    name: Validate and Build Workspace
    if: ${{ github.repository_owner == 'nikala-ui' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build All Monorepo Packages
        run: bun run build

      - name: Verify Registry Manifests Sync
        run: git diff --exit-code packages/core/registry

      - name: Typecheck Monorepo Packages
        run: |
          cd packages/core && bunx tsc --noEmit
          cd ../hooks && bunx tsc --noEmit
          cd ../cli && bunx tsc --noEmit
          cd "../../apps/web" && bunx tsc --noEmit

      - name: Execute Web App Tests
        run: cd apps/web && bunx vitest run

  npm-publish:
    name: Publish Packages to NPM & GitHub Releases
    needs: workspace-check
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'nikala-ui' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Registry Manifests & Build Packages
        run: bun run build

      - name: Setup Node for OIDC & NPM Auth
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @nikala-ui/hooks Package
        run: |
          cd packages/hooks
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/hooks@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/hooks@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nikala-ui/core Package
        run: |
          cd packages/core
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/core@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/core@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nikala-ui/cli Package
        run: |
          cd packages/cli
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/cli@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nikala-ui/mcp Package
        run: |
          cd packages/mcp
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/mcp@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nikala-ui/docs Package
        run: |
          cd packages/docs
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/docs@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/docs@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate Changelog and Update Documentation
        run: bun run changelog

      - name: Open Changelog Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/changelog-${{ github.ref_name }}
          delete-branch: true
          commit-message: "docs(changelog): update changelog for ${{ github.ref_name }}"
          title: "docs(changelog): update changelog for ${{ github.ref_name }}"
          body: |
            Automated changelog update for `${{ github.ref_name }}`.
          add-paths: |
            CHANGELOG.md
            docs/changelogs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: docs/changelogs/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
