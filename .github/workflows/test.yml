name: Nikala UI Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  run-tests:
    name: Run Vitest Suites & CLI Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile

      - name: Build Registry Manifests & CLI Packages
        run: bun run build

      - name: Verify CLI Executable Integrity
        run: node packages/cli/dist/index.js --help

      - name: Execute Web Portal Vitest Suite
        run: cd apps/web && bunx vitest run